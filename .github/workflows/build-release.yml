name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential ccache cmake gperf libssl-dev python3 zlib1g-dev

      - name: Cache compiler output
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-ccache-

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTELEGRAM_BOT_API_PROGRESS_TESTS=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux x86_64 binary
        if: github.event_name != 'pull_request'
        run: |
          install -D build/telegram-bot-api release/telegram-bot-api-linux-x86_64/telegram-bot-api
          cp docs/upload-progress.md release/telegram-bot-api-linux-x86_64/
          tar -C release -czf telegram-bot-api-linux-x86_64.tar.gz telegram-bot-api-linux-x86_64
          sha256sum telegram-bot-api-linux-x86_64.tar.gz > telegram-bot-api-linux-x86_64.tar.gz.sha256

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: telegram-bot-api-linux-x86_64
          path: |
            telegram-bot-api-linux-x86_64.tar.gz
            telegram-bot-api-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: telegram-bot-api-linux-x86_64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            telegram-bot-api-linux-x86_64.tar.gz
            telegram-bot-api-linux-x86_64.tar.gz.sha256
